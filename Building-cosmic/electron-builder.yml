appId: com.cosmic.app
productName: Cosmic
executableName: Cosmic
afterPack: build/afterPack.cjs
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  # Bundles local .env into the app Resources so packaged installs can sign in.
  # Do not commit .env; only present on the machine that runs build:mac.
  - from: .env
    to: .env
win:
  executableName: Cosmic
  icon: icon.ico
nsis:
  artifactName: Cosmic-${version}-setup.${ext}
  shortcutName: Cosmic
  uninstallDisplayName: Cosmic
  createDesktopShortcut: always
dmg:
  artifactName: Cosmic-${version}-${arch}.${ext}
  title: Cosmic
mac:
  icon: icon.icns
  category: public.app-category.productivity
  target:
    - zip
    - dmg
  entitlementsInherit: build/entitlements.mac.plist
  # Must be a map (not a YAML list) or electron-builder writes broken numeric Info.plist keys.
  extendInfo:
    CFBundleDisplayName: Cosmic
    CFBundleName: Cosmic
    NSUserNotificationAlertStyle: alert
    NSUserNotificationsUsageDescription: Cosmic shows alerts for unread Slack, Teams, and WhatsApp messages.
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
linux:
  icon: icon.png
  # Keep the .desktop entry name, WM_CLASS and package.json desktopName in sync
  # so desktops associate the running window with the launcher.
  syncDesktopName: true
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: Cosmic-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
